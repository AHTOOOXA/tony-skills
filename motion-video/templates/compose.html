<!doctype html>
<!-- motion-video · composition template.
     Contract with scripts/render.mjs:
       window.__meta  = { duration, fps, width, height, blur: [[t0,t1]…], cuts: [t…] }
       window.__seek(t) paints the frame for time t — a PURE function of t: no timers, no CSS
                        transitions, no Math.random (use rng), no state carried between frames.
       window.__ready   resolves when fonts and images are decoded.
     Replace the demo scene (SCENES at the bottom) with yours. Keep the helpers. -->
<html>
<head>
<meta charset="utf-8">
<style>
  /* Use the PRODUCT's real fonts (@font-face from its repo / @fontsource), check the script subset you need. */
  :root { --bg: #15131c; --ink: #f3ecdf; --accent: #e7b45a; --muted: rgb(243 236 223 / .7); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); }
  .layer { position: absolute; inset: 0; }
  .say { position: absolute; left: 0; right: 0; text-align: center; color: var(--ink);
         font-family: Georgia, serif; line-height: 1.15; }
  .say .ln { display: block; white-space: nowrap; }
  .say .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .14em; margin-bottom: -.14em; }
  .say .w { display: inline-block; }
  .accent { color: var(--accent); }
</style>
</head>
<body>
<div id="stage" class="layer">
  <div id="cam" class="layer" style="transform-origin:0 0">
    <div id="bg" class="layer"></div>
    <div id="hook" class="say"></div>
    <div id="card" style="position:absolute"></div>
    <div id="end" class="say"></div>
  </div>
</div>
<script>
/* ============================== format & layout ============================== */
// Lay out against the format, not fixed pixels: the same timeline renders 9:16, 1:1, 16:9.
const FORMATS = { vertical: [1080, 1920], square: [1080, 1080], wide: [1920, 1080] };
const FMT = new URLSearchParams(location.search).get('format') ?? 'vertical';
const [W, H] = FORMATS[FMT];
document.documentElement.style.setProperty('--W', W + 'px');
document.documentElement.style.setProperty('--H', H + 'px');
// Safe area for text/logos (TikTok + Reels UI): see references/layout.md
const SAFE = FMT === 'vertical' ? { x0: 65, x1: 940, y0: 270, y1: 1248 } : { x0: W * .06, x1: W * .94, y0: H * .08, y1: H * .86 };
const $ = s => document.querySelector(s);

/* ============================== math ============================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, dur) => clamp((t - t0) / dur);
// Easings, chosen by t80 (fraction of the duration where 80% of travel is done) — vary them.
const E = {
  linear: k => k,                                               // t80 .80 — almost never
  smooth: k => k * k * (3 - 2 * k),                             // .71
  inOut: k => k < .5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2, // camera, morphs
  out3: k => 1 - (1 - k) ** 3,                                  // .42 entrances
  out5: k => 1 - (1 - k) ** 5,                                  // .28 snappy entrances
  expoOut: k => k >= 1 ? 1 : 1 - 2 ** (-10 * k),                // .23 snaps
  in3: k => k ** 3, in4: k => k ** 4,                           // exits (faster than entrances)
};
// Closed-form damped spring 0→1 (no simulation: frame 812 renders without frames 0–811).
// Presets (stiffness/damping → f, z): snappy UI 320/30, cards+camera 170/26, heavy type 120/24,
// mascot/stickers 180/12 (visible overshoot — the only place it's allowed).
function spring(tau, f = 2.6, z = 0.7) {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
// A value with several targets over time = sum of springs, one per change: [[t, to], …]
function track(t, base, changes, f, z) { let v = base, p = base; for (const [t0, to] of changes) { v += (to - p) * spring(t - t0, f, z); p = to; } return v; }
// Seeded RNG (mulberry32) — never Math.random.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

/* ============================== building blocks ============================== */
/** Words that rise out of a mask line one by one. lines: [[text, cls?, style?], …] */
function setWords(el, lines) {
  el.innerHTML = lines.map(l => `<span class="ln ${l[1] ?? ''}" ${l[2] ? `style="${l[2]}"` : ''}>${l[0].split(' ').map(w => `<span class="m"><span class="w">${w}</span></span>`).join(' ')}</span>`).join('');
}
/** Masked rise in at `at` (stagger 40 ms hook … 80 ms conversational), fast exit at `outAt`. */
function riseWords(el, t, at, stagger = 0.06, dur = 0.5, outAt = null) {
  [...el.querySelectorAll('.w')].forEach((w, i) => {
    const k = E.out5(prog(t, at + i * stagger, dur));
    let y = (1 - k) * 105;
    if (outAt != null) y -= 105 * E.in4(prog(t, outAt + i * 0.02, 0.25));
    w.style.transform = `translateY(${y.toFixed(1)}%) rotate(${((1 - k) * 6).toFixed(2)}deg)`;
  });
}
/** Iris: a circle from a subject that clears the farthest corner in ~0.33 s (slower reads as a fade). */
function iris(el, t, at, [cx, cy], { dur = 0.33, close = false } = {}) {
  const rmax = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * 1.05;
  const k = prog(t, at, dur);
  const r = close ? rmax * (1 - E.in3(k)) : rmax * E.out3(k);
  el.style.clipPath = (t < at && !close) ? 'circle(0px at 0 0)' : (k >= 1 && !close) ? 'none' : `circle(${r.toFixed(1)}px at ${cx}px ${cy}px)`;
}
/** Cut-the-curve slide: out accelerates away, hard swap at `at`, in decelerates; no fade, no scale. */
function slideY(t, at, { out = 0.2, inn = 0.28, dist = 230 } = {}) {
  if (t < at) return -dist * E.in4(prog(t, at - out, out));
  return dist * (1 - E.out3(prog(t, at, inn)));
}
/** Camera: one container transform, zoom interpolated in LOG space, one eased move per beat.
 *  keys: [[t, zoom, focusX, focusY], …] — focus lands at screen centre (or pass S as 5th/6th). */
function camera(t, keys) {
  let a = keys[0], b = keys[0];
  for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0]) { a = keys[i]; b = keys[i + 1]; }
  if (t >= keys.at(-1)[0]) a = b = keys.at(-1);
  const k = a === b ? 1 : E.inOut(prog(t, a[0], b[0] - a[0]));
  const z = Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), k));
  const fx = lerp(a[2], b[2], k), fy = lerp(a[3], b[3], k);
  return `translate(${(W / 2 - z * fx).toFixed(1)}px, ${(H / 2 - z * fy).toFixed(1)}px) scale(${z.toFixed(4)})`;
}
/** Frame-quantised time: a layer that must stay SHARP inside a blur window uses tq instead of t. */
const quant = (t, fps = 30) => Math.round(t * fps) / fps;

/* Real footage (from scripts/capture.mjs takes): pick the frame for take-time ms. */
function frameAt(take, ms) {
  const fr = take.frames; let lo = 0, hi = fr.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid].t <= ms) lo = mid; else hi = mid - 1; }
  return `${take.dir}/${fr[lo].file}`;
}

/* Timing from files: a cue sheet (cues.json, {"name": seconds}) shared with scripts/mix.py ("t": "cue:name"),
   and word times from scripts/vo.py (words.json) when a voice drives the film. fetch works under file://. */
const loadJSON = async p => { const r = await fetch(p); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
/** t0 of the nth occurrence of `text` in words.json ([{w, t0, t1}, …]) — key beats to words, not seconds. */
function word(words, text, nth = 1) {
  const hits = words.filter(x => norm(x.w) === norm(text));
  if (!hits[nth - 1]) throw new Error(`word "${text}" #${nth} not in words.json`);
  return hits[nth - 1].t0;
}
/** Wait for every <img> by onload, not decode(): many concurrent decode() calls reject in Chrome, and a
 *  swallowed failure would let a missing image ship as a blank. A broken image fails __ready loudly. */
const imagesLoaded = () => Promise.all([...document.images].map(img => new Promise((ok, no) => {
  const fail = () => no(new Error(`image failed: ${img.src}`));
  if (img.complete) return img.naturalWidth ? ok() : fail(); // already settled: error events won't fire again
  img.addEventListener('load', ok, { once: true }); img.addEventListener('error', fail, { once: true });
})));

// Grain against banding is added at encode (render.mjs --grain), not here: noise in every PNG is slow and costs bitrate.

/* ============================== the demo film (replace) ============================== */
// Beat sheet: t · beat · what moves · what is still · what carries · sound
//  0.0  hook settled on frame 0 (poster)      | words           |        | —            | —
//  1.6  hook exits, card iris opens from dot   | iris            | bg     | dot → card    | whoosh
//  2.3  camera pushes into the card            | cam (log zoom)  | text   | card          | —
//  3.6  card slides out / end card slides in   | slide           |        | velocity      | paper
//  4.0  end card holds to the last frame        | —               | all    | —             | chime
const T = { hookOut: 1.4, iris: 1.6, push: 2.3, swap: 3.8, end: 6.0 };
// With a cue sheet: Object.assign(T, await loadJSON('cues.json')) at the top of __ready, then set window.__meta there
// (render.mjs reads __meta after __ready) — picture and sound read the same times.
window.__meta = {
  duration: T.end, fps: 30, width: W, height: H,
  blur: [[T.iris, T.iris + 0.36], [T.swap - 0.2, T.swap + 0.3]], // only fast moves get sub-frame blur
  cuts: [T.swap],                                               // hard swaps: never blend across
};
window.__ready = (async () => {
  $('#bg').style.background = 'radial-gradient(120% 80% at 50% 30%, #2a2348, #15131c 70%)';
  setWords($('#hook'), [['A real line from'], ['the user’s life', 'accent']]);
  setWords($('#end'), [['Product', '', 'font-size:140px'], ['where to get it', 'accent', 'font-size:56px;margin-top:24px']]);
  Object.assign($('#hook').style, { top: SAFE.y0 + 380 + 'px', fontSize: '92px' });
  Object.assign($('#end').style, { top: SAFE.y0 + 420 + 'px' });
  Object.assign($('#card').style, { left: W / 2 - 330 + 'px', top: H / 2 - 420 + 'px', width: '660px', height: '840px',
    borderRadius: '36px', background: 'linear-gradient(160deg,#4b3f8f,#231d45)', boxShadow: '0 40px 80px -30px #000' });
  await document.fonts.ready;
  await imagesLoaded();
})();

window.__seek = t => {
  riseWords($('#hook'), t, -1, 0.05, 0.5, T.hookOut);                    // settled on frame 0
  iris($('#card'), t, T.iris, [W / 2, H / 2 - 420 + 420]);
  $('#cam').style.transform = camera(t, [[0, 1, W / 2, H / 2], [T.push, 1, W / 2, H / 2], [T.push + 1.2, 1.25, W / 2, H / 2 - 60]]);
  const y = slideY(t, T.swap);
  $('#card').style.transform = `translateY(${t < T.swap ? y : 2000}px)`;
  $('#end').style.display = t >= T.swap ? 'block' : 'none';
  $('#end').style.transform = `translateY(${t >= T.swap ? y : 0}px)`;
  riseWords($('#end'), t, T.swap + 0.15, 0.07, 0.55);
};
</script>
</body>
</html>
